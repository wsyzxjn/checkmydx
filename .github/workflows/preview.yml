# PR preview: upload a Worker version (does not replace production) and comment
# the *.workers.dev preview URL. Cloudflare Workers Builds will also start
# posting preview links once wrangler.jsonc has preview_urls enabled.
name: Cloudflare preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare token
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set. Skipping wrangler preview deploy."
            echo "Cloudflare Workers Builds should still comment a preview URL after workers_dev/preview_urls are enabled in wrangler.jsonc."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.has_token == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.has_token == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        if: steps.creds.outputs.has_token == 'true'
        run: |
          npm ci
          npm run build

      - name: Resolve Cloudflare account
        if: steps.creds.outputs.has_token == 'true'
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          else
            echo "CLOUDFLARE_ACCOUNT_ID=0114a961487be284d8e6a91050d8e136" >> "$GITHUB_ENV"
          fi

      - name: Upload Worker preview version
        if: steps.creds.outputs.has_token == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.number }}

      - name: Comment preview URL
        if: steps.creds.outputs.has_token == 'true'
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.deployment-alias-url }}
          COMMAND_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          PR_NUMBER: ${{ github.event.number }}
        with:
          script: |
            const marker = "<!-- checkmydx-cf-preview -->";
            const blob = [
              process.env.DEPLOY_URL,
              process.env.ALIAS_URL,
              process.env.COMMAND_OUTPUT,
            ]
              .filter(Boolean)
              .join("\n");
            const urls = [
              ...new Set(
                (blob.match(/https:\/\/[a-zA-Z0-9._-]+\.workers\.dev/g) || []),
              ),
            ];
            const alias =
              process.env.ALIAS_URL ||
              urls.find((url) => url.includes(`pr-${process.env.PR_NUMBER}`)) ||
              "";
            const commitUrl =
              process.env.DEPLOY_URL ||
              urls.find((url) => url !== alias) ||
              urls[0] ||
              "";
            const primary = alias || commitUrl;
            if (!primary) {
              core.setFailed(
                "Wrangler preview deploy succeeded but no workers.dev URL was found in the output.",
              );
              return;
            }
            const examples = [
              `${primary}/amatsuka`,
              `${primary}/amatsuka?template=bento`,
              `${primary}/amatsuka?template=minimal`,
            ];
            const body = `${marker}
            ## Cloudflare 预览

            这次提交已上传为 Worker 预览版本，**不会替换** [checkmydx.amatsuka.net](https://checkmydx.amatsuka.net) 线上环境。

            | 类型 | 链接 |
            | --- | --- |
            | 稳定预览 (PR #${process.env.PR_NUMBER}) | ${alias || primary} |
            | 本次提交 | ${commitUrl || "—"} |

            示例页：
            - [查分器风格](${examples[0]})
            - [Bento](${examples[1]})
            - [极简](${examples[2]})
            `.replace(/^[ \t]+/gm, "");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
